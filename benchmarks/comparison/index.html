<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lume / Three.js comparison</title>
    <script type="module" src="/src/main.ts"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #07090f;
        color: #f5f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 15% -10%, rgb(76 99 255 / 18%), transparent 34rem), #07090f;
      }

      .benchmark-nav {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: end;
        padding: 16px clamp(16px, 3vw, 40px);
        border-bottom: 1px solid #252a38;
        background: rgb(7 9 15 / 92%);
        backdrop-filter: blur(18px);
      }

      .brand {
        margin-right: auto;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #8da0ff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(18px, 2vw, 24px);
        letter-spacing: -0.03em;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: #a9b1c7;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      select,
      input,
      button {
        min-height: 38px;
        border: 1px solid #303748;
        border-radius: 9px;
        color: #f5f7ff;
        background: #111522;
        font: inherit;
      }

      select,
      input {
        padding: 0 34px 0 11px;
      }

      input {
        width: 112px;
        padding-right: 11px;
      }

      button {
        padding: 0 18px;
        border-color: #677cff;
        background: linear-gradient(135deg, #5268f5, #7456e8);
        font-weight: 750;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.08);
      }

      main {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: clamp(16px, 3vw, 40px);
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 18px;
      }

      .badge {
        padding: 6px 10px;
        border: 1px solid #2d3445;
        border-radius: 999px;
        color: #bec7dc;
        background: #10141f;
        font:
          600 12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }

      .badge[data-status="running"] {
        border-color: #5268f5;
        color: #cbd3ff;
      }

      .badge[data-status="complete"] {
        border-color: #267052;
        color: #84e0b8;
      }

      .viewport-shell {
        overflow: hidden;
        width: 1280px;
        max-width: 100%;
        border: 1px solid #262c3b;
        border-radius: 16px;
        background: #050816;
        box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
      }

      canvas {
        display: block;
        width: 1280px;
        height: 720px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin: 18px 0;
      }

      .metric {
        min-height: 104px;
        padding: 16px;
        border: 1px solid #252c3c;
        border-radius: 13px;
        background: linear-gradient(145deg, rgb(22 27 42 / 92%), rgb(12 15 24 / 92%));
      }

      .metric-name {
        margin: 0 0 12px;
        color: #929db5;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric-value {
        margin: 0;
        font-size: 22px;
        font-weight: 760;
        letter-spacing: -0.035em;
      }

      details {
        border: 1px solid #252c3c;
        border-radius: 13px;
        background: #0c0f18;
      }

      summary {
        padding: 14px 16px;
        color: #c5cde0;
        font-weight: 700;
        cursor: pointer;
      }

      pre {
        overflow: auto;
        max-height: 560px;
        margin: 0;
        padding: 0 16px 18px;
        color: #aeb9d2;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          12px/1.65 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      @media (max-width: 760px) {
        .benchmark-nav,
        .controls {
          align-items: stretch;
        }

        .brand,
        .controls,
        label,
        select,
        input,
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav class="benchmark-nav" aria-label="Benchmark scenarios">
      <div class="brand">
        <p class="eyebrow">WebGPU benchmark lab</p>
        <h1>Lume / Three.js comparison</h1>
      </div>
      <form class="controls" method="get" aria-label="Benchmark controls">
        <label for="implementation">
          Engine
          <select id="implementation" name="implementation">
            <option value="lume">Lume</option>
            <option value="three">Three.js</option>
          </select>
        </label>
        <label for="count">
          Entities
          <select id="count" name="count">
            <option value="1000">1,000</option>
            <option value="10000">10,000</option>
            <option value="50000">50,000</option>
            <option value="100000">100,000</option>
          </select>
        </label>
        <label for="update-ratio">
          Updated / frame
          <select id="update-ratio" name="updateRatio">
            <option value="0">0% — static</option>
            <option value="0.01">1%</option>
            <option value="0.1">10%</option>
            <option value="1">100%</option>
          </select>
        </label>
        <label for="commit">
          Commit
          <input id="commit" name="commit" placeholder="optional" autocomplete="off" />
        </label>
        <button type="submit">Run benchmark</button>
      </form>
    </nav>

    <main>
      <div class="status-row">
        <span id="status" class="badge" data-status="running">Preparing benchmark…</span>
        <span id="scenario" class="badge"></span>
      </div>
      <section class="viewport-shell" aria-label="Rendered benchmark scene">
        <canvas id="viewport"></canvas>
      </section>
      <section id="metrics" class="metrics" aria-label="Benchmark summary"></section>
      <details>
        <summary>Raw benchmark report</summary>
        <pre id="results">Preparing comparison…</pre>
      </details>
    </main>
  </body>
</html>
